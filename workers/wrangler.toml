# Storage1024 — Cloudflare Workers (FREE plan, no credit card)
#
# 1. `npm install`
# 2. `npx wrangler login`
# 3. `npx wrangler kv namespace create INDEX`  → paste the printed id below
# 4. `npx wrangler secret put BOT_TOKEN`
#    `npx wrangler secret put CHANNEL_ID`
#    `npx wrangler secret put CREATE_PROJECT_KEY`   (optional but recommended)
# 5. `npm run deploy`
#
# Full walkthrough: ../deploy/workers.md

name = "storage1024"
main = "src/index.js"
compatibility_date = "2026-10-27"

# Gives you https://storage1024.<your-subdomain>.workers.dev — permanent,
# always-on, and it does not sleep. No card required on the free plan.
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Default behaviour: a matching static asset is served by Cloudflare directly
# (free + unlimited), anything else invokes the Worker for /api and /f routes.

[[kv_namespaces]]
binding = "INDEX"
# Replace with the id from `npx wrangler kv namespace create INDEX`.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Only non-secret settings go here. Everything sensitive is a Wrangler secret.
[vars]
# MAX_FILE_MB = "19"  # informational; the hard cap is in src/index.js
